<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portified - Portfolio Dashboard</title>
    <link rel="stylesheet" href="dashboard-style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Compact Header with Integrated Summary -->
        <header class="compact-header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>PORTIFIED</span>
                </div>
            </div>
            <div class="header-center">
                <div class="summary-compact">
                    <div class="summary-item">
                        <span class="label">Total Value</span>
                        <span class="value" id="totalValue">$0</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Cash Balance</span>
                        <span class="value" id="settlementAccountBalance">$1000</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button id="refreshPricesBtn" class="compact-btn">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="themeToggle" class="compact-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="main-content-compact">
            <!-- Top Row: Portfolio Holdings and Performance Side by Side -->
            <div class="content-grid">
                <!-- Portfolio Table -->
                <section class="portfolio-section-compact">
                <div class="section-header">
                    <h2><i class="fas fa-wallet"></i> Portfolio Holdings</h2>
                    <div class="section-actions">
                        <select id="assetTypeFilter" class="filter-select">
                            <option value="all">All Assets</option>
                            <option value="stock">Stocks</option>
                            <option value="bond">Bonds</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table id="portfolioTable" class="data-table-compact">
                        <thead>
                            <tr>
                                <th class="col-asset">Asset</th>
                                <th class="col-type">Type</th>
                                <th class="col-qty">Qty</th>
                                <th class="col-buy-price">Buy $</th>
                                <th class="col-current-price">Current $</th>
                                <th class="col-value">Value</th>
                                <th class="col-pnl">P&L</th>
                                <th class="col-pnl-pct">P&L %</th>
                                <th class="col-actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="portfolioTableBody">
                            <!-- Portfolio data will be loaded here -->
                        </tbody>
                    </table>
                </div>
                </section>

                <!-- Performance Chart -->
                <section class="chart-section-compact">
                    <div class="section-header-compact">
                        <h3><i class="fas fa-chart-area"></i> Performance</h3>
                    </div>
                    <div class="chart-container-compact">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </section>
            </div>

            <!-- Bottom Row: Add Asset and Transactions -->
            <div class="bottom-row">
                <!-- Add Asset Form -->
                <section class="add-asset-section-compact">
                    <div class="section-header-compact">
                        <h3><i class="fas fa-plus-circle"></i> Add Asset</h3>
                    </div>
                <form id="addAssetForm" class="add-asset-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="assetType">
                                <i class="fas fa-layer-group"></i>
                                Asset Type
                            </label>
                            <select id="assetType" required>
                                <option value="">Select Type</option>
                                <option value="stock">Stock</option>
                                <option value="bond">Bond</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ticker">
                                <i class="fas fa-tag"></i>
                                Ticker Symbol
                            </label>
                            <input type="text" id="ticker" required placeholder="e.g., AAPL">
                        </div>
                        <div class="form-group">
                            <label for="quantity">
                                <i class="fas fa-sort-numeric-up"></i>
                                Quantity
                            </label>
                            <input type="number" id="quantity" required min="1" placeholder="Shares">
                        </div>
                        <div class="form-group">
                            <label for="price">
                                <i class="fas fa-dollar-sign"></i>
                                Purchase Price
                            </label>
                            <input type="number" id="price" required min="0" step="0.01" placeholder="$0.00">
                        </div>
                        <div class="form-group">
                            <button type="submit" class="submit-btn">
                                <i class="fas fa-plus"></i>
                                Add Asset
                            </button>
                        </div>
                    </div>
                </form>
                </section>

                <!-- Transaction History Table -->
                <section class="transactions-section-compact">
                    <div class="section-header-compact">
                        <h3><i class="fas fa-history"></i> Recent Transactions</h3>
                        <select id="transactionFilter" class="filter-select-compact">
                            <option value="all">All</option>
                            <option value="buy">Buy</option>
                            <option value="sell">Sell</option>
                        </select>
                    </div>
                    <div class="table-container-compact">
                        <table id="transactionsTable" class="data-table-compact">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Asset</th>
                                    <th>Action</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTableBody">
                                <!-- Transaction data will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="dashboard-script.js"></script>
</body>
</html>
