<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Portfolio Manager</h1>
            <div class="summary" id="summary">
                <div class="summary-item">
                    <span class="label">Total Value:</span>
                    <span class="value" id="totalValue">$0.00</span>
                </div>
                <div class="summary-item">
                    <span class="label">Assets:</span>
                    <span class="value" id="totalAssets">0</span>
                </div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="showTab('portfolio')">Portfolio</button>
            <button class="tab-btn" onclick="showTab('add')">Add Asset</button>
            <button class="tab-btn" onclick="showTab('transactions')">Transactions</button>
        </nav>

        <!-- Portfolio Tab -->
        <div id="portfolio" class="tab-content active">
            <h2>Your Portfolio</h2>
            <div class="portfolio-grid" id="portfolioGrid">
                <!-- Portfolio items will be loaded here -->
            </div>
        </div>

        <!-- Add Asset Tab -->
        <div id="add" class="tab-content">
            <h2>Add New Asset</h2>
            <form id="addAssetForm" class="form">
                <div class="form-group">
                    <label for="ticker">Ticker Symbol:</label>
                    <input type="text" id="ticker" required placeholder="e.g., AAPL">
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" required min="1">
                </div>
                <div class="form-group">
                    <label for="price">Purchase Price:</label>
                    <input type="number" id="price" required min="0" step="0.01">
                </div>
                <button type="submit">Add to Portfolio</button>
            </form>
        </div>

        <!-- Transactions Tab -->
        <div id="transactions" class="tab-content">
            <h2>Transaction History</h2>
            <div class="transactions-list" id="transactionsList">
                <!-- Transactions will be loaded here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
